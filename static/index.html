<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>溢油应急响应与任务追踪</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}.card{border:1px solid #d7dee5;border-radius:6px;padding:.6rem .9rem;margin:.5rem 0}.card ul{margin:.3rem 0 .1rem 1.1rem;padding:0}.tag{display:inline-block;background:#eef3f7;border-radius:4px;padding:0 .4rem;margin-left:.4rem;font-size:.85em}.busy{color:#a33}.idle{color:#273}</style></head><body><h1>溢油应急响应与任务追踪</h1><p>围控、回收、岸线保护和废弃物处置任务，按证据和监测结果闭环</p><p>估算油量、海况和未完成任务数影响响应等级；关闭前必须完成回收和岸线监测记录，且全部调派资源撤收。</p><button onclick="loadAll()">刷新列表</button><h2>事件当前占用</h2><div id="items">加载中…</div><h2>资源值守状态</h2><div id="resources">加载中…</div><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>const H={'X-Actor':'demo','X-Role':'viewer'};function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function renderItem(it){const occ=(it.active_assignments||[]).map(a=>'<li><b>'+esc(a.call_sign)+'</b>｜'+esc(a.task)+'｜负责人 '+esc(a.leader)+'｜区域 '+esc(a.area)+'｜计划 '+esc(a.planned_start)+' ~ '+esc(a.planned_end)+'</li>').join('');return '<div class="card"><b>#'+it.id+' '+esc(it.title)+'</b><span class="tag">'+esc(it.status)+'</span><span class="tag">优先级 '+it.priority+'</span><br>当前占用：<ul>'+(occ||'<li>无</li>')+'</ul></div>'}function renderResource(r){const state=r.on_duty?'<span class="busy">在岗（事件#'+r.active_item_id+'）</span>':'<span class="idle">待命</span>';return '<div class="card"><b>'+esc(r.call_sign)+'</b><span class="tag">'+esc(r.kind)+'</span><br>值守区域 '+esc(r.home_area)+'｜当前区域 '+esc(r.current_area)+'｜'+state+'</div>'}async function loadAll(){const ir=await fetch('/api/items',{headers:H});const items=(await ir.json()).items||[];document.getElementById('items').innerHTML=items.map(renderItem).join('')||'暂无事件';const rr=await fetch('/api/resources',{headers:H});const resources=(await rr.json()).resources||[];document.getElementById('resources').innerHTML=resources.map(renderResource).join('')||'暂无资源'}loadAll()</script></body></html>
